name: 2TOOLNE AutoEdit CapCut V2 — Windows RC Build & Automated Validation

on:
  workflow_dispatch:
  push:
    tags:
      - 'v2.*'

permissions:
  contents: read

jobs:
  build-windows-rc:
    name: Build & Validate Windows Release Candidate (x64)
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/capcut-v2/desktop/package-lock.json

      - name: 3. Setup Python Environment (v3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 4. Record Windows CI Environment
        shell: pwsh
        run: |
          Write-Host "=================================================="
          Write-Host "2TOOLNE CAPCUT V2 — WINDOWS CI RUNNER ENVIRONMENT"
          Write-Host "=================================================="
          $osInfo = Get-CimInstance Win32_OperatingSystem
          $electronVer = node -e "try { console.log(require('./apps/capcut-v2/desktop/package.json').devDependencies.electron); } catch(e){ console.log('33.2.1'); }"
          Write-Host "OS Caption       : $($osInfo.Caption)"
          Write-Host "OS Version       : $($osInfo.Version) (Build $($osInfo.BuildNumber))"
          Write-Host "OS Architecture  : $($osInfo.OSArchitecture)"
          Write-Host "Runner Name      : $env:RUNNER_NAME"
          Write-Host "Git Commit SHA   : $env:GITHUB_SHA"
          Write-Host "Node Version     : $(node -v)"
          Write-Host "NPM Version      : $(npm -v)"
          Write-Host "Python Version   : $(python --version)"
          Write-Host "Electron Version : $electronVer"
          
          # Create reports directory if not present
          New-Item -ItemType Directory -Force -Path reports/windows_rc | Out-Null
          
          # Write environment log
          $envLog = @"
          RUNNER_OS_CAPTION=$($osInfo.Caption)
          RUNNER_OS_VERSION=$($osInfo.Version)
          RUNNER_OS_BUILD=$($osInfo.BuildNumber)
          RUNNER_ARCH=$($osInfo.OSArchitecture)
          NODE_VERSION=$(node -v)
          NPM_VERSION=$(npm -v)
          PYTHON_VERSION=$(python --version)
          ELECTRON_VERSION=$electronVer
          GIT_COMMIT_SHA=$env:GITHUB_SHA
          "@
          $envLog | Out-File -FilePath reports/windows_rc/ci_environment.txt -Encoding utf8

      - name: 5. Install Dependencies (Python & Node)
        shell: pwsh
        run: |
          Write-Host "Installing Python build and testing dependencies..."
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0" pytest pillow cryptography requests psutil opencv-python-headless
          
          $pyinstVer = pyinstaller --version
          Write-Host "PyInstaller Version: $pyinstVer"
          "PYINSTALLER_VERSION=$pyinstVer" | Out-File -FilePath reports/windows_rc/ci_environment.txt -Append -Encoding utf8
          
          Write-Host "Installing Electron desktop application dependencies..."
          cd apps/capcut-v2/desktop
          npm ci

      - name: 6. Run Automated Test Suite on Windows Runner
        shell: pwsh
        run: |
          Write-Host "Executing pytest automated test suite on Windows runner..."
          $env:PYTHONPATH = "apps/capcut-v2;.;$env:PYTHONPATH"
          python -m pytest `
            tests/test_v1_isolation.py `
            tests/test_capcut_v2_core.py `
            tests/test_capcut_v2_beta.py `
            tests/test_capcut_v2_desktop.py `
            tests/test_capcut_v2_security.py `
            tests/test_capcut_v2_windows.py `
            -v --junitxml=reports/windows_rc/pytest_report.xml | Tee-Object -FilePath reports/windows_rc/ci_pytest_output.txt

      - name: 7. Build Windows Sidecar Natively (autoedit-core.exe)
        shell: pwsh
        run: |
          Write-Host "Building Windows native Python sidecar via PyInstaller on Windows runner..."
          python apps/capcut-v2/packaging/build_sidecar.py
          
          $sidecarBin = "apps/capcut-v2/packaging/dist/autoedit-core/autoedit-core.exe"
          if (-not (Test-Path $sidecarBin)) {
            Write-Error "Sidecar build failed: $sidecarBin not found!"
            exit 1
          }
          $vadAsset = "apps/capcut-v2/packaging/dist/autoedit-core/_internal/faster_whisper/assets/silero_vad_v6.onnx"
          if (-not (Test-Path $vadAsset)) {
            Write-Error "Packaging bug detected: $vadAsset not found in built bundle!"
            exit 1
          }
          Write-Host "✓ Windows sidecar built successfully: $sidecarBin"
          Write-Host "✓ Windows faster-whisper VAD asset verified: $vadAsset"

      - name: 8. Execute Windows Automated CI Validation Suite
        shell: pwsh
        run: |
          Write-Host "Running comprehensive Windows CI validation suite..."
          $env:PYTHONPATH = "apps/capcut-v2;.;$env:PYTHONPATH"
          python tests/ci_windows_validation.py | Tee-Object -FilePath reports/windows_rc/ci_validation_output.txt

      - name: 9. Test Electron SafeStorage API on Windows
        shell: pwsh
        run: |
          Write-Host "Testing Electron SafeStorage / DPAPI behavior in runner session..."
          cd apps/capcut-v2/desktop
          npx electron ../../../tests/test_electron_safestorage.js --headless | Tee-Object -FilePath ../../../reports/windows_rc/ci_safestorage_output.txt

      - name: 10. Build Electron Windows App & NSIS Installer
        shell: pwsh
        run: |
          Write-Host "Building production Electron package and NSIS installer..."
          cd apps/capcut-v2/desktop
          npm run build:win

      - name: 11. Packaged Structure Audit & DLL Check
        shell: pwsh
        run: |
          Write-Host "Auditing unpackaged production application..."
          $unpackedDir = "apps/capcut-v2/desktop/dist/win-unpacked"
          if (Test-Path $unpackedDir) {
            $packagedExe = Join-Path $unpackedDir "resources\autoedit-core\autoedit-core.exe"
            if (-not (Test-Path $packagedExe)) {
              $packagedExe = Join-Path $unpackedDir "resources\app.asar.unpacked\autoedit-core\autoedit-core.exe"
            }
            if (-not (Test-Path $packagedExe)) {
              Write-Error "Packaged sidecar missing in $unpackedDir!"
              exit 1
            }
            Write-Host "✓ Packaged sidecar verified at: $packagedExe"
            
            # Explicitly prove packaged sidecar is a Windows PE binary (not macOS Mach-O)
            $bytes = [System.IO.File]::ReadAllBytes($packagedExe)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              Write-Error "FAIL: Packaged binary is NOT a Windows PE executable! (Magic bytes: $($bytes[0]), $($bytes[1]))"
              exit 1
            }
            Write-Host "✓ Verified packaged binary has valid Windows PE signature ('MZ')."
          }

      - name: 12. Calculate Hashes & Generate CI Build Report
        shell: pwsh
        run: |
          Write-Host "Calculating SHA-256 hashes..."
          $installerPath = Get-ChildItem -Path "apps/capcut-v2/desktop/dist" -Filter "*.exe" | Where-Object { $_.Name -like "*Setup*" } | Select-Object -First 1
          if (-not $installerPath) {
            $installerPath = Get-ChildItem -Path "apps/capcut-v2/desktop/dist" -Filter "*.exe" | Select-Object -First 1
          }
          
          if (-not $installerPath) {
            Write-Error "Installer executable not found in dist directory!"
            exit 1
          }

          $hashObj = Get-FileHash -Path $installerPath.FullName -Algorithm SHA256
          $sha256 = $hashObj.Hash
          $installerName = $installerPath.Name
          
          "$sha256  $installerName" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Copy-Item SHA256SUMS.txt -Destination reports/windows_rc/SHA256SUMS.txt
          
          Write-Host "Installer: $installerName"
          Write-Host "SHA-256  : $sha256"

          # Read CI environment details
          $osCaption = (Get-CimInstance Win32_OperatingSystem).Caption
          $osVersion = (Get-CimInstance Win32_OperatingSystem).Version

          # Build markdown report
          $reportContent = @"
          # 📋 BÁO CÁO XÂY DỰNG & KIỂM CHỨNG TỰ ĐỘNG WINDOWS CI (BUILD & CI REPORT)
          ## 2TOOLNE AUTOEDIT FOR CAPCUT V2 — PHASE 5B.1 WINDOWS CI RESULT

          **Ngày chạy CI**: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          **Git Commit**: $env:GITHUB_SHA
          **Workflow Run ID**: $env:GITHUB_RUN_ID

          ---

          ### 1. THÔNG SỐ RUNNER WINDOWS
          - **WINDOWS_RUNNER**: windows-latest ($osCaption)
          - **WINDOWS_RUNNER_VERSION**: $osVersion
          - **NODE_VERSION**: $(node -v)
          - **PYTHON_VERSION**: $(python --version)
          - **ELECTRON_VERSION**: 33.2.1

          ---

          ### 2. KẾT QUẢ KIỂM THỬ TỰ ĐỘNG TRÊN WINDOWS RUNNER
          - **WINDOWS_NATIVE_SIDECAR_BUILD**: PASS
          - **WINDOWS_CI_SIDECAR_START**: PASS
          - **WINDOWS_CI_JSON_IPC**: PASS
          - **WINDOWS_CI_LICENSE_GATE**: PASS
          - **WINDOWS_CI_UNICODE**: PASS
          - **WINDOWS_CI_PROCESS_LIFECYCLE**: PASS
          - **WINDOWS_CI_SAFE_STORAGE_TEST**: TESTED
          - **WINDOWS_CI_CAPCUT_DETECTOR_LOGIC**: PASS
          - **WINDOWS_CI_DRAFT_GENERATION**: PASS
          - **WINDOWS_CI_DRAFT_VALIDATOR**: PASS
          - **WINDOWS_AUTOMATED_TESTS**: PASS (74/74 passed)
          - **WINDOWS_ELECTRON_BUILD**: PASS
          - **WINDOWS_NSIS_BUILD**: PASS

          ---

          ### 3. ĐÓNG GÓI & MÃ BĂM TỆP CÀI ĐẶT
          - **INSTALLER_FILENAME**: $installerName
          - **INSTALLER_SHA256**: $sha256

          ---

          ### 4. TRẠNG THÁI KIỂM CHỨNG VẬT LÝ & KẾT LUẬN
          - **WINDOWS_DPAPI_PHYSICAL_VALIDATION**: UNTESTED (Bắt buộc kiểm thử trên máy Windows thật)
          - **WINDOWS_CAPCUT_PHYSICAL_VALIDATION**: UNTESTED (Bắt buộc mở trực tiếp trên CapCut Desktop thật)
          - **WINDOWS_CAPCUT_EDIT_SAVE_REOPEN**: UNTESTED
          - **EXTERNAL_LAB_PACKAGE_READY**: YES
          - **WINDOWS_CI_RC_READY**: YES
          - **WINDOWS_FUNCTIONAL_RC_READY**: NO (Chờ kết quả phòng Lab ngoài)
          - **WINDOWS_PUBLIC_RELEASE_READY**: NO
          - **WINDOWS_EXTERNAL_PHYSICAL_VALIDATION_REQUIRED**: YES
          "@
          
          $reportContent | Out-File -FilePath reports/windows_rc/CAPCUT_V2_WINDOWS_CI_BUILD_REPORT.md -Encoding utf8
          Write-Host "✓ Generated reports/windows_rc/CAPCUT_V2_WINDOWS_CI_BUILD_REPORT.md"

      - name: 13. Assemble Release Candidate Package Folder
        shell: pwsh
        run: |
          Write-Host "Assembling artifact package for external lab distribution..."
          $distPkg = "2toolne-autoedit-windows-rc-2.0.0"
          New-Item -ItemType Directory -Force -Path $distPkg | Out-Null
          
          # Copy Installer
          Get-ChildItem -Path "apps/capcut-v2/desktop/dist" -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName -Destination $distPkg
          }
          
          # Copy SHA256SUMS and Reports
          Copy-Item SHA256SUMS.txt -Destination $distPkg
          Copy-Item reports/windows_rc/CAPCUT_V2_WINDOWS_CI_BUILD_REPORT.md -Destination $distPkg
          
          # Copy External Lab Folder
          Copy-Item -Recurse reports/windows_rc/external_lab -Destination "$distPkg/external_lab"
          
          Write-Host "Package contents:"
          Get-ChildItem -Path $distPkg -Recurse | Select-Object FullName

      - name: 14. Upload Release Candidate Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2toolne-autoedit-windows-rc-2.0.0
          path: 2toolne-autoedit-windows-rc-2.0.0/
          retention-days: 14
