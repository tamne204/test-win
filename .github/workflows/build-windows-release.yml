name: Build & Deploy Windows Native Release (windows-latest)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to build and deploy (e.g. 2.0.4, 2.0.5)'
        required: true
        default: '2.0.4'
  push:
    tags:
      - 'v2.*'

jobs:
  build-and-deploy-windows:
    name: Build Native Windows Package & Direct Server Deploy
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Clean Build Directories and Caches
        shell: pwsh
        run: |
          Write-Host "Cleaning build, dist, and pycache directories..."
          Remove-Item -Recurse -Force apps/capcut-v2/packaging/build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force apps/capcut-v2/packaging/dist -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force apps/capcut-v2/desktop/dist -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA/pyinstaller" -ErrorAction SilentlyContinue
          Get-ChildItem -Path . -Include __pycache__ -Recurse -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: 5. Install Dependencies
        shell: pwsh
        run: |
          Write-Host "Installing Python build dependencies..."
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0" pytest pillow cryptography requests psutil opencv-python-headless faster-whisper soundfile numpy pefile
          
          Write-Host "PyInstaller Version: $(pyinstaller --version)"
          Write-Host "Python Version: $(python --version)"
          
          Write-Host "Installing Electron desktop application dependencies..."
          cd apps/capcut-v2/desktop
          npm ci

      - name: 6. Build Windows Sidecar Fresh via PyInstaller (autoedit-core.exe)
        shell: pwsh
        run: |
          Write-Host "=================================================="
          Write-Host "RUNNING FRESH PYINSTALLER BUILD ON WINDOWS RUNNER"
          Write-Host "=================================================="
          python apps/capcut-v2/packaging/build_sidecar.py
          
          $sidecarBin = "apps/capcut-v2/packaging/dist/autoedit-core/autoedit-core.exe"
          if (-not (Test-Path $sidecarBin)) {
            Write-Error "Sidecar build failed: $sidecarBin not found!"
            exit 1
          }
          $vadAsset = "apps/capcut-v2/packaging/dist/autoedit-core/_internal/faster_whisper/assets/silero_vad_v6.onnx"
          if (-not (Test-Path $vadAsset)) {
            Write-Error "Packaging bug detected: $vadAsset not found in built bundle!"
            exit 1
          }
          $sidecarSize = (Get-Item $sidecarBin).Length
          $sidecarHash = (Get-FileHash -Path $sidecarBin -Algorithm SHA256).Hash
          Write-Host "✓ Fresh autoedit-core.exe built successfully: $sidecarBin ($sidecarSize bytes)"
          Write-Host "✓ Fresh autoedit-core.exe SHA256: $sidecarHash"
          Write-Host "✓ Bundled VAD asset verified: $vadAsset"

      - name: 7. Packaged Sidecar Direct Runtime Test
        shell: pwsh
        run: |
          Write-Host "=================================================="
          Write-Host "TESTING FRESH PACKAGED SIDECAR EXECUTION DIRECTLY"
          Write-Host "=================================================="
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          $env:AUTOEDIT_CORE_EXE = "apps/capcut-v2/packaging/dist/autoedit-core/autoedit-core.exe"
          python tests/test_packaged_windows_sidecar_rpc.py

      - name: 8. Ensure External Binaries and Resources
        shell: pwsh
        run: |
          Write-Host "Verifying Windows external binaries (ffmpeg.exe, ffprobe.exe, CapCutUiProbe.exe)..."
          $binDir = "apps/capcut-v2/desktop/resources/bin/win-x64"
          $engineDir = "apps/capcut-v2/desktop/resources/engine/win-x64"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          New-Item -ItemType Directory -Force -Path $engineDir | Out-Null
          
          $ffmpegExe = Join-Path $binDir "ffmpeg.exe"
          $ffprobeExe = Join-Path $binDir "ffprobe.exe"
          if ((-not (Test-Path $ffmpegExe)) -or (-not (Test-Path $ffprobeExe))) {
            Write-Host "Downloading official static FFmpeg builds for Windows..."
            $zipPath = "$env:TEMP\ffmpeg-win64.zip"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg-extracted" -Force
            $foundFfmpeg = Get-ChildItem -Path "$env:TEMP\ffmpeg-extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
            $foundFfprobe = Get-ChildItem -Path "$env:TEMP\ffmpeg-extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
            Copy-Item $foundFfmpeg.FullName -Destination $ffmpegExe -Force
            Copy-Item $foundFfprobe.FullName -Destination $ffprobeExe -Force
          }
          
          $probeExe = Join-Path $binDir "CapCutUiProbe.exe"
          if ((-not (Test-Path $probeExe)) -and (Get-Command "g++" -ErrorAction SilentlyContinue)) {
            Write-Host "Compiling CapCutUiProbe.exe via g++..."
            g++ -O3 -std=c++17 apps/capcut-v2/desktop/src/main/capcut_ui_probe/CapCutUiProbe.cpp -o $probeExe
          }

      - name: 9. Build Electron Desktop Package & Assemble Release ZIP
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.release_version || '2.0.4' }}"
          Write-Host "=================================================="
          Write-Host "ASSEMBLING 2TOOLNE AUTOEDIT $ver WINDOWS PACKAGE"
          Write-Host "=================================================="
          
          # Sync newly built sidecar to desktop resources
          $targetDir = "apps/capcut-v2/desktop/resources/autoedit-core/win-x64"
          Remove-Item -Recurse -Force $targetDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item "apps/capcut-v2/packaging/dist/autoedit-core/*" -Destination $targetDir -Recurse -Force
          
          # Build win-unpacked with electron-builder pack
          cd apps/capcut-v2/desktop
          npm run pack
          cd ../../..
          
          # Audit win-unpacked
          node apps/capcut-v2/desktop/scripts/verify_windows_package.js
          
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $finalZip = "dist/2toolne-autoedit-$ver-win-x64.zip"
          if (Test-Path $finalZip) { Remove-Item -Force $finalZip }
          Compress-Archive -Path "apps/capcut-v2/desktop/dist/win-unpacked/*" -DestinationPath $finalZip -Force
          
          $zipSize = (Get-Item $finalZip).Length
          $zipHash = (Get-FileHash -Path $finalZip -Algorithm SHA256).Hash.ToLower()
          
          Write-Host "=================================================="
          Write-Host "2TOOLNE $ver WINDOWS PACKAGE CREATED!"
          Write-Host "FILE: $finalZip"
          Write-Host "SIZE: $zipSize bytes"
          Write-Host "SHA256: $zipHash"
          Write-Host "=================================================="
          
          # Write manifest
          @{
            UPDATE_PACKAGE = "2toolne-autoedit-$ver-win-x64.zip"
            UPDATE_PACKAGE_SIZE = $zipSize
            UPDATE_PACKAGE_SHA256 = $zipHash
            VERSION = $ver
            GIT_COMMIT = $env:GITHUB_SHA
          } | ConvertTo-Json | Out-File -FilePath "dist/manifest_$ver.json" -Encoding utf8

      - name: 10. Deploy Package Direct to 2TOOLNE Production Server via FTP (Zero GitHub Artifacts)
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.release_version || '2.0.4' }}"
          Write-Host "=================================================="
          Write-Host "DEPLOYING $ver WINDOWS PACKAGE DIRECTLY TO 2TOOLNE SERVER"
          Write-Host "=================================================="
          $ftpHost = "43.129.165.150"
          $ftpUser = "2tamne_site_code"
          $ftpPass = "eKZ8ZN5tsd7D"
          
          # 1. Upload autoedit-core.exe
          $coreExe = "apps/capcut-v2/packaging/dist/autoedit-core/autoedit-core.exe"
          Write-Host "Uploading autoedit-core-$ver.exe ($((Get-Item $coreExe).Length) bytes)..."
          curl.exe -s -T $coreExe -u "${ftpUser}:${ftpPass}" "ftp://${ftpHost}:21/storage/packages/autoedit-core-${ver}.exe"
          
          # 2. Upload manifest
          $manifest = "dist/manifest_$ver.json"
          curl.exe -s -T $manifest -u "${ftpUser}:${ftpPass}" "ftp://${ftpHost}:21/storage/packages/manifest_${ver}.json"
          
          # 3. Upload release zip directly
          $pkgZip = "dist/2toolne-autoedit-$ver-win-x64.zip"
          Write-Host "Uploading 2toolne-autoedit-$ver-win-x64.zip ($((Get-Item $pkgZip).Length) bytes)..."
          curl.exe -T $pkgZip -u "${ftpUser}:${ftpPass}" "ftp://${ftpHost}:21/storage/packages/2toolne-autoedit-${ver}-win-x64.zip"
          
          Write-Host "Direct upload to production server completed successfully!"
          Write-Host "Zero GitHub Artifacts stored. Ephemeral runner will be discarded safely."
