<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2TOOLNE Popover</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-app: #0E0F11;
      --surface-1: #15171A;
      --surface-2: #1A1C20;
      --surface-3: #202228;
      --border-default: #292C31;
      --brand-primary: #FF7A00;
      --brand-soft: rgba(255, 122, 0, 0.12);
      --text-primary: #FFFFFF;
      --text-muted: #8E929B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      background: transparent !important;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Outer wrapper provides 10px margin so the native box-shadow is not clipped */
    .popover-container {
      padding: 10px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    .popover-card {
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7), 0 4px 12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .ws-header {
      padding: 10px 14px 6px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .ws-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .ws-list::-webkit-scrollbar {
      width: 5px;
    }
    .ws-list::-webkit-scrollbar-thumb {
      background: var(--border-default);
      border-radius: 4px;
    }

    .ws-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
      font-size: 13px;
      color: var(--text-primary);
      gap: 10px;
    }

    .ws-item:hover {
      background: var(--surface-2);
    }

    .ws-item.active {
      background: var(--brand-soft);
      font-weight: 600;
      color: var(--brand-primary);
    }

    .ws-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }

    .ws-item-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: inherit;
    }

    .ws-item-icon svg {
      width: 14px;
      height: 14px;
    }

    .ws-item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ws-badge-role {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .ws-role-owner {
      background: rgba(255, 122, 0, 0.15);
      color: #FF7A00;
      border: 1px solid rgba(255, 122, 0, 0.3);
    }

    .ws-role-editor {
      background: rgba(59, 130, 246, 0.15);
      color: #60A5FA;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .ws-role-viewer {
      background: rgba(156, 163, 175, 0.15);
      color: #9CA3AF;
      border: 1px solid rgba(156, 163, 175, 0.3);
    }

    .ws-role-member {
      background: rgba(156, 163, 175, 0.15);
      color: #9CA3AF;
      border: 1px solid rgba(156, 163, 175, 0.3);
    }

    .ws-divider {
      height: 1px;
      background: var(--border-default);
      margin: 4px 0;
    }

    .ws-action {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
      font-family: inherit;
    }

    .ws-action:hover {
      background: var(--surface-2);
      color: var(--brand-primary);
    }

    .ws-action-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .ws-action-icon svg {
      width: 14px;
      height: 14px;
    }
  </style>
</head>
<body>
  <div class="popover-container" id="popoverContainer">
    <div class="popover-card" id="popoverCard">
      <!-- Dynamically populated -->
    </div>
  </div>

  <script src="popover.js"></script>
</body>
</html>
