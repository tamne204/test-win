appId: site.2tamne.autoedit
productName: 2TOOLNE AutoEdit
copyright: Copyright © 2026 2TOOLNE Team

directories:
  output: dist
  buildResources: assets

files:
  - "**/*"
  - "!dist/**"
  - "!tests/**"
  - "!reports/**"
  - "!diagnostics/**"
  - "!**/.pytest_cache/**"
  - "!**/__pycache__/**"
  - "!**/*.pyc"
  - "!**/*.pyo"
  - "!**/.DS_Store"

extraResources:
  - from: "../packaging/dist/autoedit-core"
    to: "autoedit-core"
    filter:
      - "**/*"
      - "!**/reports/**"
      - "!**/diagnostics/**"
      - "!**/.pytest_cache/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: "resources/bin"
    to: "bin"
    filter:
      - "**/*"
  - from: "resources/engine"
    to: "engine"
    filter:
      - "**/*"

mac:
  icon: assets/icon.icns
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 2TOOLNE AutoEdit
  uninstallDisplayName: 2TOOLNE AutoEdit
  installerIcon: assets/installerIcon.ico
  uninstallerIcon: assets/uninstallerIcon.ico
  installerHeaderIcon: assets/icon.ico
  artifactName: "2TOOLNE-AutoEdit-Setup-${version}.${ext}"
